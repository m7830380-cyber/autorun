name: Build Autorun (AMD64)

on:
  workflow_dispatch:
  push:
    branches:
      - build-amd64

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex xz-utils

      - name: Build Autorun AMD64 package
        run: |
          sh build.sh
          ls -lh horizon-wine/build-autorun/

      - name: Build ntdll.dll (ARM64X)
        run: |
          llvm="$(ls -d "$PWD"/horizon-wine/toolchains/llvm-mingw-*-x86_64 | head -1)"
          export PATH="$llvm/bin:$PATH"
          make -C horizon-wine/build-wine-amd64-pe -j"$(nproc)" dlls/ntdll/aarch64-windows/ntdll.dll
          mkdir -p horizon-wine/build-dlls
          llvm-strip --strip-debug -o horizon-wine/build-dlls/ntdll.dll             horizon-wine/build-wine-amd64-pe/dlls/ntdll/aarch64-windows/ntdll.dll
          ls -l horizon-wine/build-dlls/

      - name: Upload ntdll.dll
        uses: actions/upload-artifact@v4
        with:
          name: ntdll-arm64x
          path: horizon-wine/build-dlls/ntdll.dll
          if-no-files-found: error

      - name: Upload Autorun package
        uses: actions/upload-artifact@v4
        with:
          name: autorun-amd64
          path: horizon-wine/build-autorun/autorun-*.zip
          if-no-files-found: error
